<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>profile</title>
<meta name="description" content="meine links, alle an einem ort">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="profile.css">
</head>
<body>

<canvas id="bg"></canvas>
<div class="aurora"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
<div class="cursor-glow" id="cursorGlow"></div>
<div class="vignette"></div>
<div class="grain"></div>

<div id="gate"><div class="g-inner">
  <p class="g-hint" id="gateHint">klick irgendwo zum betreten</p>
</div></div>

<div class="stage" id="stage">
<section class="panel"><div class="tilt" id="tilt">
  <main class="card" id="card">
    <div class="av-wrap">
      <span class="av-ring"></span>
      <div class="av" id="avatar">?</div>
      <span class="status" id="status" title="offline"></span>
    </div>

    <h1 class="name" id="name">profile
      <svg class="badge-v" id="verified" viewBox="0 0 24 24" fill="currentColor" aria-label="verifiziert">
        <path d="M12 1.6l2.4 2.1 3.2-.3.8 3.1 2.8 1.6-1.3 2.9 1.3 2.9-2.8 1.6-.8 3.1-3.2-.3L12 20.4 9.6 18.3l-3.2.3-.8-3.1L2.8 13.9 4.1 11 2.8 8.1l2.8-1.6.8-3.1 3.2.3z"/>
        <path d="M8.2 11.9l2.5 2.5 5.1-5.1" fill="none" stroke="#0d0b1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </h1>
    <p class="handle" id="handle">@—</p>
    <p class="custom-status" id="customStatus"></p>
    <p class="bio" id="bio"></p>

    <ul class="tags" id="tags"></ul>
    <nav class="socials" id="socials" aria-label="links"></nav>

    <section class="presence" id="presence" aria-live="polite"></section>

    <div class="meta">
      <span class="views">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
        <span id="viewCount">—</span>
      </span>
      <span class="dot-sep">·</span>
      <span class="live off" id="liveDot"><i></i><span id="liveText">verbinde…</span></span>
    </div>
  </main>
</div></section>

<section class="panel"><div class="tilt">
  <section class="card about-card">
    <span class="about-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3l1.8 4.9L18.5 9l-4.7 1.9L12 15.8l-1.8-4.9L5.5 9l4.7-1.9z"/>
        <path d="M19 15.5l.8 2.1 2.1.8-2.1.8-.8 2.1-.8-2.1-2.1-.8 2.1-.8z"/>
      </svg>
    </span>
    <h2 class="about-title">about me</h2>
    <span class="about-rule"></span>
    <p class="about-text" id="aboutText"></p>
  </section>
</div></section>
</div>

<div class="scroll-hint" id="scrollHint">
  <span>scroll</span>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
</div>

<div class="dots" id="dots" aria-label="abschnitte"></div>

<div class="player" id="player">
  <button id="muteBtn" aria-label="stumm schalten"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" id="muteIcon"></svg></button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.4" aria-label="lautstärke">
</div>

const KIND = { 0:"spielt gerade", 1:"streamt", 2:"hört", 3:"schaut", 5:"tritt an" };

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---- statische config anwenden ---- */
document.documentElement.style.setProperty('--glow-a', CONFIG.accents.a);
document.documentElement.style.setProperty('--glow-b', CONFIG.accents.b);
document.documentElement.style.setProperty('--glow-c', CONFIG.accents.c);
$('#gateHint').textContent = CONFIG.gateHint;
$('#bio').textContent = CONFIG.bio;
$('#aboutText').textContent = CONFIG.aboutMe;
if (!CONFIG.verified) $('#verified').remove();
$('#tags').innerHTML = (CONFIG.tags || []).map(t => '<li>' + esc(t) + '</li>').join('');
$('#socials').innerHTML = (CONFIG.links || []).map(l =>
  '<a class="s" href="' + esc(l.url) + '" target="_blank" rel="noopener noreferrer" data-label="' + esc(l.label) + '"'
  + ' aria-label="' + esc(l.label) + '" style="--c:' + esc(l.color || 'var(--glow-b)') + '">'
  + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'
  + (ICONS[l.icon] || ICONS.website) + '</svg></a>').join('');

setIdentity(CONFIG.fallback.username, CONFIG.fallback.handle);
function setIdentity(name, handle){
  $('#name').childNodes[0].nodeValue = (CONFIG.overrideName || name) + ' ';
  $('#handle').textContent = CONFIG.overrideHandle || handle;
  document.title = CONFIG.overrideName || name;
  if (!$('#avatar').querySelector('img')) $('#avatar').textContent = (name[0] || '?').toUpperCase();
}

/* ---- besucherzähler (nur in diesem browser) ---- */
try {
  const n = (parseInt(localStorage.getItem('pv') || '0', 10) || 0) + 1;
  localStorage.setItem('pv', String(n));
  $('#viewCount').textContent = n.toLocaleString('de-DE');
} catch (e) { $('#viewCount').textContent = '1'; }

/* ============================================================
   LANYARD
   ============================================================ */
const ID = CONFIG.discordId;
let ws = null, hb = null, ticker = null, lastData = null;

function live(on, text){
  $('#liveDot').classList.toggle('off', !on);
  $('#liveText').textContent = text;
}

function connect(){
  if (!/^\d{17,20}$/.test(ID)){ live(false, 'keine discord-id gesetzt'); return; }
  try { ws = new WebSocket('wss://api.lanyard.rest/socket'); }
  catch (e) { restFallback(); return; }

  ws.onopen = () => live(true, 'live');
  ws.onmessage = ev => {
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.op === 1){
      clearInterval(hb);
      hb = setInterval(() => { try { ws.send(JSON.stringify({ op:3 })); } catch(e){} }, m.d.heartbeat_interval);
      ws.send(JSON.stringify({ op:2, d:{ subscribe_to_id: ID } }));
    }
    if (m.op === 0 && (m.t === 'INIT_STATE' || m.t === 'PRESENCE_UPDATE')){
      const d = m.d && m.d.discord_user ? m.d : (m.d && m.d[ID]);
      if (d) render(d);
    }
  };
  ws.onclose = () => { clearInterval(hb); live(false, 'getrennt'); setTimeout(connect, 6000); };
  ws.onerror  = () => { live(false, 'offline-modus'); restFallback(); };
}

function restFallback(){
  fetch('https://api.lanyard.rest/v1/users/' + ID)
    .then(r => r.json())
    .then(j => { if (j && j.success && j.data){ render(j.data); live(true, 'aktualisiert'); } })
    .catch(() => live(false, 'lanyard nicht erreichbar'));
}

function avatarUrl(u){
  if (!u) return null;
  if (u.avatar){
    const ext = u.avatar.startsWith('a_') ? 'gif' : 'png';
    return 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.' + ext + '?size=256';
  }
  let i = 0;
  try { i = Number((BigInt(u.id) >> 22n) % 6n); } catch (e) { i = 0; }
  return 'https://cdn.discordapp.com/embed/avatars/' + i + '.png';
}

function assetUrl(act, key){
  const img = act.assets && act.assets[key];
  if (!img) return null;
  if (img.indexOf('spotify:') === 0) return 'https://i.scdn.co/image/' + img.slice(8);
  if (img.indexOf('mp:') === 0)      return 'https://media.discordapp.net/' + img.slice(3);
  if (act.application_id)            return 'https://cdn.discordapp.com/app-assets/' + act.application_id + '/' + img + '.png';
  return null;
}

function hhmmss(ms){
  if (ms < 0) ms = 0;
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  const p = n => String(n).padStart(2, '0');
  return (h ? h + ':' : '') + p(m) + ':' + p(s);
}

function render(d){
  lastData = d;
  const u = d.discord_user || {};

  if (u.username) setIdentity(u.global_name || u.display_name || u.username, '@' + u.username);

  const url = avatarUrl(u);
  const av = $('#avatar');
  if (url && av.dataset.src !== url){
    av.dataset.src = url;
    const img = new Image();
    img.onload  = () => { av.innerHTML = ''; av.appendChild(img); };
    img.onerror = () => { av.textContent = ((CONFIG.overrideName || u.global_name || u.username || '?')[0] || '?').toUpperCase(); };
    img.alt = '';
    img.src = url;
  }

  const st = d.discord_status || 'offline';
  const col = STATUS_COLORS[st] || STATUS_COLORS.offline;
  $('#status').style.background = col;
  $('#status').style.boxShadow = st === 'offline' ? 'none' : '0 0 12px ' + col;
  $('#status').title = st;

  const acts = d.activities || [];
  const custom = acts.find(a => a.type === 4);
  const cs = $('#customStatus');
  if (custom && (custom.state || custom.emoji)){
    const em = custom.emoji && custom.emoji.id
      ? '<img src="https://cdn.discordapp.com/emojis/' + custom.emoji.id + (custom.emoji.animated ? '.gif' : '.png')
        + '?size=32" alt="" style="width:16px;height:16px;border-radius:3px">'
      : (custom.emoji && custom.emoji.name ? esc(custom.emoji.name) : '');
    cs.innerHTML = em + '<span>' + esc(custom.state || '') + '</span>';
    cs.style.display = 'flex';
  } else { cs.style.display = 'none'; cs.innerHTML = ''; }

  const cards = [];

  if (d.listening_to_spotify && d.spotify){
    const sp = d.spotify;
    cards.push(
      '<a class="act" href="https://open.spotify.com/track/' + esc(sp.track_id) + '" target="_blank" rel="noopener noreferrer">'
      + '<div class="act-art">' + (sp.album_art_url ? '<img src="' + esc(sp.album_art_url) + '" alt="">' : ICON_NOTE) + '</div>'
      + '<div class="act-txt">'
        + '<p class="act-kind">hört spotify</p>'
        + '<p class="act-name">' + esc(sp.song) + '</p>'
        + '<p class="act-line">' + esc(sp.artist) + '</p>'
        + '<div class="bar"><span data-start="' + (sp.timestamps && sp.timestamps.start || 0)
          + '" data-end="' + (sp.timestamps && sp.timestamps.end || 0) + '"></span></div>'
      + '</div></a>');
  }

  acts.filter(a => a.type !== 4 && !(a.name === 'Spotify' && d.listening_to_spotify)).slice(0, 2).forEach(a => {
    const big = assetUrl(a, 'large_image'), small = assetUrl(a, 'small_image');
    const lines = [a.details, a.state].filter(Boolean).map(t => '<p class="act-line">' + esc(t) + '</p>').join('');
    const start = a.timestamps && a.timestamps.start;
    cards.push(
      '<div class="act">'
      + '<div class="act-art">' + (big ? '<img src="' + esc(big) + '" alt="">' : ICON_GAME)
        + (small ? '<img class="act-sub" src="' + esc(small) + '" alt="">' : '') + '</div>'
      + '<div class="act-txt">'
        + '<p class="act-kind">' + (KIND[a.type] || 'aktiv') + '</p>'
        + '<p class="act-name">' + esc(a.name) + '</p>'
        + lines
        + (start ? '<p class="act-time" data-elapsed="' + start + '">00:00</p>' : '')
      + '</div></div>');
  });

  const box = $('#presence');
  box.innerHTML = cards.join('');
  box.classList.toggle('on', cards.length > 0);
  startTicker();
}

function startTicker(){
  clearInterval(ticker);
  const tick = () => {
    const now = Date.now();
    document.querySelectorAll('[data-elapsed]').forEach(el => {
      el.textContent = hhmmss(now - Number(el.dataset.elapsed)) + ' läuft';
    });
    document.querySelectorAll('.bar span').forEach(el => {
      const s = Number(el.dataset.start), e = Number(el.dataset.end);
      if (!s || !e || e <= s) return;
      el.style.width = Math.max(0, Math.min(100, (now - s) / (e - s) * 100)) + '%';
    });
  };
  tick();
  ticker = setInterval(tick, 1000);
}

/* ---- partikel ---- */
const cv = $('#bg'), ctx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let parts = [], W = 0, H = 0, dpr = Math.min(devicePixelRatio || 1, 2);
function resize(){
  W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  parts = Array.from({ length: Math.round(Math.min(90, innerWidth / 14)) }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: (Math.random() * 1.5 + .4) * dpr,
    vx: (Math.random() - .5) * .12 * dpr, vy: (-Math.random() * .22 - .04) * dpr,
    a: Math.random() * .5 + .15
  }));
}
function frame(){
  ctx.clearRect(0, 0, W, H);
  for (const p of parts){
    p.x += p.vx; p.y += p.vy;
    if (p.y < -10){ p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
    ctx.fillStyle = 'rgba(200,190,255,' + p.a + ')'; ctx.fill();
  }
  requestAnimationFrame(frame);
}
addEventListener('resize', resize);
resize();
if (!reduce) frame();

/* ---- cursor + tilt ---- */
const glow = $('#cursorGlow'), card = $('#card'), tiltBox = $('#tilt');
if (matchMedia('(pointer:fine)').matches && !reduce){
  addEventListener('pointermove', e => {
    glow.style.opacity = 1;
    glow.style.transform = 'translate(' + e.clientX + 'px,' + e.clientY + 'px)';
  });
  tiltBox.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    card.style.transition = 'transform .12s ease-out';
    card.style.transform = 'rotateY(' + (px * 9) + 'deg) rotateX(' + (-py * 9) + 'deg)';
  });
  tiltBox.addEventListener('pointerleave', () => {
    card.style.transition = 'transform .6s cubic-bezier(.2,.9,.25,1)';
    card.style.transform = 'rotateY(0) rotateX(0)';
  });
}

/* ---- musik ---- */
const ICON_VOL = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.2 8.8a5 5 0 010 6.4"/><path d="M18.8 6.2a8.5 8.5 0 010 11.6"/>';
const ICON_MUTE = '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9l5 6M21 9l-5 6"/>';
let audio = null;
if (CONFIG.music && CONFIG.music.src){
  audio = new Audio(CONFIG.music.src);
  audio.loop = true;
  audio.volume = CONFIG.music.volume != null ? CONFIG.music.volume : .4;
  $('#player').style.display = 'flex';
  $('#vol').value = audio.volume;
  $('#vol').addEventListener('input', e => { audio.volume = +e.target.value; });
  $('#muteBtn').addEventListener('click', () => {
    audio.muted = !audio.muted;
    setMuteIcon(audio.muted);
  });
  setMuteIcon(audio.muted);
}
function setMuteIcon(muted){
  $('#muteIcon').innerHTML = muted ? ICON_MUTE : ICON_VOL;
}

/* ---- abschnitte / dots ---- */
const stage = $('#stage');
const panels = Array.from(document.querySelectorAll('.panel'));
let activeIndex = 0;
function goToPanel(i){
  activeIndex = Math.max(0, Math.min(panels.length - 1, i));
  panels[activeIndex].scrollIntoView({ behavior: 'smooth' });
  $('#scrollHint').classList.toggle('show', activeIndex === 0);
}
const dots = panels.map((p, i) => {
  const b = document.createElement('button');
  b.className = 'dot';
  b.setAttribute('aria-label', 'abschnitt ' + (i + 1));
  b.addEventListener('click', () => goToPanel(i));
  $('#dots').appendChild(b);
  return b;
});
if (panels.length > 1){
  $('#dots').style.display = 'flex';
  $('#scrollHint').classList.add('show');
  const panelObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const i = panels.indexOf(e.target);
      dots[i].classList.toggle('active', e.isIntersecting);
      if (e.isIntersecting){
        activeIndex = i;
        $('#scrollHint').classList.toggle('show', i === 0);
      }
    });
  }, { root: stage, threshold: 0.6 });
  panels.forEach(p => panelObserver.observe(p));

  // ein Scroll (Rad/Trackpad) = direkt ein Abschnitt weiter, smooth animiert
  let wheelLock = false;
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    if (wheelLock) return;
    wheelLock = true;
    goToPanel(activeIndex + (e.deltaY > 0 ? 1 : -1));
    setTimeout(() => { wheelLock = false; }, 650);
  }, { passive: false });
}

/* ---- gate ---- */
function enter(){
  if (document.body.classList.contains('entered')) return;
  document.body.classList.add('entered');
  if (audio) audio.play().catch(() => {});
  setTimeout(() => { const g = $('#gate'); if (g) g.remove(); }, 900);
}
$('#gate').addEventListener('click', enter);
addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') enter(); });

connect();
</script>
